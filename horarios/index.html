<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios de Terapias 2027 — NEUROS</title>
<style>
  :root{
    --violeta: #6b3fa0;
    --violeta-osc: #512e7a;
    --naranja: #e07b2d;
    --naranja-osc: #b85f1c;
    --gris: #4a4a4a;
    --bg: #f4f3f7;
  }
  *{box-sizing:border-box;}
  body{
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    margin:0;
    color: var(--gris);
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  header{ display:flex; align-items:center; gap:12px; margin-bottom: 24px; }
  header h1{ font-size: 20px; margin:0; color: var(--violeta-osc); }
  .card{
    background:#fff; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    padding: 24px; margin-bottom: 20px;
  }
  label{ display:block; font-size: 13px; font-weight:600; margin-bottom:4px; color:#333; }
  input[type=text], input[type=password]{
    width:100%; padding:10px 12px; border:1px solid #cfd6d3;
    border-radius:6px; font-size:15px; margin-bottom:14px;
  }
  button{
    border:none; border-radius:6px; padding:11px 18px;
    font-size:15px; font-weight:600; cursor:pointer; color:#fff;
  }
  button.violeta{ background: var(--violeta); }
  button.violeta:hover{ background: var(--violeta-osc); }
  button.naranja{ background: var(--naranja); }
  button.naranja:hover{ background: var(--naranja-osc); }
  button:disabled{ background:#aab; cursor:not-allowed; opacity:.6; }
  .fila{ display:flex; gap:12px; flex-wrap:wrap; }
  .fila > *{ flex:1; min-width: 220px; }
  #loginError, #estado{ font-size: 13px; margin-top: 6px; }
  #loginError{ color:#b3261e; }
  #estado.ok{ color: var(--violeta-osc); }
  #estado.error{ color:#b3261e; }
  .oculto{ display:none !important; }
  .resultado{ border-top:1px solid #e3e7e5; margin-top:18px; padding-top:18px; }
  .paciente-info{ background: #f3edf9; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:14px; }
  .paciente-info b{ color: var(--violeta-osc); }
  table.horarios{ width:100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 13px; }
  table.horarios th, table.horarios td{ border:1px solid #e0dbe8; padding:6px 8px; text-align:left; }
  table.horarios th{ background:#f3edf9; }
  .botones-pdf{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;}
  footer{ text-align:center; font-size:12px; color:#8a938f; margin-top: 30px; }
  .badge{
    display:inline-block; background:#fff3cd; color:#8a6d00;
    border-radius:4px; padding:2px 8px; font-size:11px; font-weight:600;
    margin-left:8px; vertical-align:middle;
  }
  .sugerencias{
    border:1px solid #e0dbe8; border-radius:8px; max-height:220px;
    overflow-y:auto; margin-top:-8px; margin-bottom:14px; background:#fff;
  }
  .sugerencias div{ padding:8px 12px; cursor:pointer; font-size:14px; }
  .sugerencias div:hover{ background:#f3edf9; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="logo_neuros_small.png" alt="NEUROS" style="width:44px;height:44px;">
    <h1>📅 Horarios de Terapias 2027 — NEUROS</h1>
  </header>

  <div class="card" id="pantallaLogin">
    <label for="passInput">Contraseña del personal de NEUROS</label>
    <input type="password" id="passInput" placeholder="Ingresá la contraseña">
    <button class="violeta" id="btnLogin">Entrar</button>
    <div id="loginError"></div>
  </div>

  <div id="pantallaApp" class="oculto">

    <div class="card">
      <label for="buscador">Buscar paciente (apellido, nombre o DNI)</label>
      <input type="text" id="buscador" placeholder="Ej: Pérez, Juan o 30111222" autocomplete="off">
      <div id="sugerencias" class="sugerencias oculto"></div>
      <div id="estado"></div>
    </div>

    <div class="card resultado oculto" id="tarjetaResultado">
      <div class="paciente-info" id="infoPaciente"></div>

      <div class="fila">
        <div>
          <label for="periodoRehab">Período de rehabilitación</label>
          <input type="text" id="periodoRehab" placeholder="Ej: Marzo 2027">
        </div>
        <div>
          <label for="periodoEsc">Período de escuela / CET / centro de día (si aplica)</label>
          <input type="text" id="periodoEsc" placeholder="Dejar vacío si usa el mismo período">
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="turnoSelect">Turno (para el nombre del archivo)</label>
          <select id="turnoSelect" style="width:100%;padding:10px 12px;border:1px solid #cfd6d3;border-radius:6px;font-size:15px;margin-bottom:14px;">
            <option value="MAÑANA">Mañana</option>
            <option value="TARDE">Tarde</option>
          </select>
        </div>
        <div>
          <label for="obraSocialInput">Obra social (para el nombre del archivo)</label>
          <input type="text" id="obraSocialInput" placeholder="Ej: OSDE">
        </div>
      </div>

      <div id="entradaSalidaPorDia"></div>

      <h3 style="font-size:14px;color:var(--violeta-osc);margin-bottom:4px;">Horario — versión familia (con profesional)</h3>
      <div id="tablaFamilia"></div>

      <h3 style="font-size:14px;color:var(--naranja-osc);margin-bottom:4px;">Horario — versión transporte / obra social</h3>
      <div id="tablaTransporte"></div>

      <div class="botones-pdf">
        <button class="violeta" id="btnPdfFamilia">📄 PDF para la familia</button>
        <button class="naranja" id="btnPdfTransporte">📄 PDF para transporte / obra social</button>
      </div>
    </div>

  </div>

  <footer>
    Centro de Neurorrehabilitación NEUROS — Uso interno<span class="badge">EN CONSTRUCCIÓN</span>
  </footer>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="pacientes_enc.js"></script>
<script src="logo_const.js"></script>
<script>
/* ============================================================
   HORARIOS DE TERAPIAS 2027 — NEUROS
   Estado: versión con datos reales de 2027 PLANES.xlsx (T.Mañana
   + T.Tarde), 237 pacientes, cargada el 24/11.

   FALTA PARA TERMINAR DE VERDAD:
   1) Contraseña definitiva (ahora: placeholder "NEUROS2027" —
      avisame la real y vuelvo a encriptar pacientes_enc.js)
   2) Membrete de color de NEUROS (CERTIFICADO_NEUROS1_1.pdf) para
      el isologo — por ahora el PDF usa el nombre en texto, sin logo
   3) Confirmar diseño final de cada PDF (qué textos exactos van)
   ============================================================ */

let BASE_PACIENTES = [];

// ---- Login + desencriptado ----
document.getElementById('btnLogin').addEventListener('click', intentarLogin);
document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') intentarLogin();
});

async function intentarLogin(){
  const pass = document.getElementById('passInput').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try{
    const datos = await desencriptar(pass);
    BASE_PACIENTES = datos;
    document.getElementById('pantallaLogin').classList.add('oculto');
    document.getElementById('pantallaApp').classList.remove('oculto');
    precargarDesdeURL();
  } catch(e){
    err.textContent = 'Contraseña incorrecta.';
  }
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function desencriptar(password){
  const enc = new TextEncoder();
  const salt = b64ToBytes(PACIENTES_ENC.salt);
  const iv = b64ToBytes(PACIENTES_ENC.iv);
  const data = b64ToBytes(PACIENTES_ENC.data);

  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations: PACIENTES_ENC.iterations, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  const text = new TextDecoder().decode(plainBuf);
  return JSON.parse(text);
}

// ---- Precarga desde la URL (misma convención que Armar pedido) ----
function leerParamsHash(){
  const hash = window.location.hash.replace(/^#/, '');
  const params = {};
  hash.split('&').forEach(par => {
    if (!par) return;
    const [k, v] = par.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent((v || '').replace(/\+/g, ' '));
  });
  return params;
}

function precargarDesdeURL(){
  const p = leerParamsHash();
  if (p.dni){
    document.getElementById('buscador').value = p.dni;
    buscarPaciente();
  } else if (p.ap || p.no){
    const texto = [p.ap, p.no].filter(Boolean).join(' ');
    document.getElementById('buscador').value = texto.trim();
    buscarPaciente();
  }
}

// ---- Buscador ----
const buscadorInput = document.getElementById('buscador');
const sugerenciasBox = document.getElementById('sugerencias');

buscadorInput.addEventListener('input', () => mostrarSugerencias(buscadorInput.value));
buscadorInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { sugerenciasBox.classList.add('oculto'); buscarPaciente(); }
});
document.addEventListener('click', e => {
  if (!sugerenciasBox.contains(e.target) && e.target !== buscadorInput){
    sugerenciasBox.classList.add('oculto');
  }
});

function normaliza(s){
  return (s||'').toString().toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function mostrarSugerencias(q){
  const qn = normaliza(q).trim();
  if (!qn || qn.length < 2){ sugerenciasBox.classList.add('oculto'); sugerenciasBox.innerHTML=''; return; }
  const matches = BASE_PACIENTES.filter(p =>
    normaliza(p.nombre).includes(qn) || (p.dni||'').includes(qn)
  ).slice(0, 15);
  if (matches.length === 0){ sugerenciasBox.classList.add('oculto'); sugerenciasBox.innerHTML=''; return; }
  sugerenciasBox.innerHTML = matches.map(p =>
    `<div data-dni="${p.dni}">${escapeHtml(p.nombre)} — DNI ${escapeHtml(p.dni)}</div>`
  ).join('');
  sugerenciasBox.classList.remove('oculto');
  sugerenciasBox.querySelectorAll('div').forEach(div => {
    div.addEventListener('click', () => {
      buscadorInput.value = div.dataset.dni;
      sugerenciasBox.classList.add('oculto');
      buscarPaciente();
    });
  });
}

let pacienteActual = null;

function buscarPaciente(){
  const q = buscadorInput.value.trim();
  const qn = normaliza(q);
  const estado = document.getElementById('estado');
  const tarjeta = document.getElementById('tarjetaResultado');

  if (!q){ estado.textContent = ''; tarjeta.classList.add('oculto'); return; }

  const exactoDni = BASE_PACIENTES.find(p => p.dni === q.replace(/\D/g,''));
  const porNombre = BASE_PACIENTES.filter(p => normaliza(p.nombre).includes(qn));
  const encontrado = exactoDni || (porNombre.length === 1 ? porNombre[0] : null);

  if (!encontrado){
    estado.className = 'error';
    estado.textContent = porNombre.length > 1
      ? `Hay ${porNombre.length} pacientes que coinciden — elegí uno de la lista de sugerencias.`
      : 'No se encontró ningún paciente con ese dato.';
    tarjeta.classList.add('oculto');
    pacienteActual = null;
    return;
  }

  pacienteActual = encontrado;
  estado.textContent = '';
  mostrarPaciente(encontrado);
  tarjeta.classList.remove('oculto');
}

const DIAS = ['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES'];

function tablaHorarios(horarios){
  const prestaciones = Object.keys(horarios);
  if (prestaciones.length === 0){
    return '<p style="font-size:13px;color:#888;">Sin datos cargados — a completar por la coordinadora.</p>';
  }
  let html = '<table class="horarios"><tr><th>Prestación</th>' + DIAS.map(d=>`<th>${d}</th>`).join('') + '</tr>';
  prestaciones.forEach(pres => {
    html += `<tr><td>${escapeHtml(pres)}</td>` +
      DIAS.map(d => `<td>${escapeHtml(horarios[pres][d] || '')}</td>`).join('') +
      '</tr>';
  });
  html += '</table>';
  return html;
}

function diasConTransporte(p){
  const base = (p.horariosTransporte && Object.keys(p.horariosTransporte).length) ? p.horariosTransporte : (p.horariosFamilia || {});
  const set = new Set();
  Object.values(base).forEach(porDia => { DIAS.forEach(d => { if (porDia[d]) set.add(d); }); });
  return DIAS.filter(d => set.has(d));
}

function mostrarPaciente(p){
  document.getElementById('infoPaciente').innerHTML =
    `<b>${escapeHtml(p.nombre)}</b> — DNI ${escapeHtml(p.dni)}` +
    (p.obraSocial ? ` — Obra social: ${escapeHtml(p.obraSocial)}` : '');
  document.getElementById('tablaFamilia').innerHTML = tablaHorarios(p.horariosFamilia || {});
  document.getElementById('tablaTransporte').innerHTML = tablaHorarios(p.horariosTransporte || {});

  document.getElementById('turnoSelect').value = (p.turno === 'tarde') ? 'TARDE' : 'MAÑANA';
  document.getElementById('obraSocialInput').value = p.obraSocial || '';

  const dias = diasConTransporte(p);
  const cont = document.getElementById('entradaSalidaPorDia');
  if (dias.length === 0){
    cont.innerHTML = '<p style="font-size:13px;color:#888;">Sin días de transporte cargados todavía.</p>';
  } else {
    cont.innerHTML = '<label style="margin-bottom:8px;">Horario de entrada y salida de transporte (puede variar por día)</label>' +
      dias.map(d => `
        <div class="fila">
          <div><label for="e_${d}">Entrada ${d}</label><input type="text" id="e_${d}" class="horaEntradaDia" data-dia="${d}" placeholder="Ej: 08:30"></div>
          <div><label for="s_${d}">Salida ${d}</label><input type="text" id="s_${d}" class="horaSalidaDia" data-dia="${d}" placeholder="Ej: 12:00"></div>
        </div>
      `).join('');
  }
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Generación de PDF ----
document.getElementById('btnPdfFamilia').addEventListener('click', () => generarPDF('familia'));
document.getElementById('btnPdfTransporte').addEventListener('click', () => generarPDF('transporte'));

async function generarPDF(tipo){
  if (!pacienteActual){ alert('Primero buscá un paciente.'); return; }

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const page = pdfDoc.addPage([595, 842]); // A4
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const colorTitulo = tipo === 'familia' ? rgb(0.42, 0.25, 0.63) : rgb(0.88, 0.48, 0.18);
  const tituloDoc = tipo === 'familia' ? 'HORARIOS DE TERAPIAS 2027 — PARA LA FAMILIA' : 'HORARIOS DE TERAPIAS 2027 — TRANSPORTE / OBRA SOCIAL';

  const periodoRehab = document.getElementById('periodoRehab').value;
  const periodoEsc = document.getElementById('periodoEsc').value;
  const obraSocial = (document.getElementById('obraSocialInput').value || '').trim();
  const horarios = tipo === 'familia' ? (pacienteActual.horariosFamilia || {}) : (pacienteActual.horariosTransporte || {});

  const entradaSalidaPorDia = {};
  document.querySelectorAll('.horaEntradaDia').forEach(inp => {
    entradaSalidaPorDia[inp.dataset.dia] = entradaSalidaPorDia[inp.dataset.dia] || {};
    entradaSalidaPorDia[inp.dataset.dia].entrada = inp.value;
  });
  document.querySelectorAll('.horaSalidaDia').forEach(inp => {
    entradaSalidaPorDia[inp.dataset.dia] = entradaSalidaPorDia[inp.dataset.dia] || {};
    entradaSalidaPorDia[inp.dataset.dia].salida = inp.value;
  });
  const diasEntradaSalida = DIAS.filter(d => entradaSalidaPorDia[d]);

  // Logo NEUROS (arriba a la derecha)
  try{
    const logoBytes = b64ToBytes(LOGO_NEUROS_B64);
    const logoImg = await pdfDoc.embedPng(logoBytes);
    const logoDim = logoImg.scale(50/logoImg.width);
    page.drawImage(logoImg, { x: 595-50-50, y: 842-50-30, width: logoDim.width, height: logoDim.height });
  } catch(e){ /* si falla, sigue sin logo */ }

  let y = 800;
  const draw = (text, opts={}) => {
    page.drawText(text, { x: opts.x ?? 50, y, size: opts.size ?? 11, font: opts.bold ? fontBold : font, color: opts.color ?? rgb(0,0,0) });
    y -= opts.gap ?? 20;
  };

  draw('NEUROS — Centro de Neurorrehabilitación', { bold:true, size:14, color: colorTitulo, gap: 20 });
  draw(tituloDoc, { bold:true, size:12, color: colorTitulo, gap: 28 });

  draw('Paciente: ' + pacienteActual.nombre, { bold:true });
  draw('DNI: ' + pacienteActual.dni);
  draw('Período de rehabilitación: ' + (periodoRehab || '-'));
  if (periodoEsc) draw('Período de escuela / CET / centro de día: ' + periodoEsc);

  if (tipo === 'familia'){
    if (diasEntradaSalida.length){
      draw('Horario de entrada y salida (transporte):', { bold:true, gap: 16 });
      diasEntradaSalida.forEach(d => {
        const e = entradaSalidaPorDia[d];
        draw(d + ': entrada ' + (e.entrada || '-') + ' — salida ' + (e.salida || '-'), { size:10, gap: 15 });
      });
      y -= 8;
    } else {
      draw('Horario de entrada y salida (transporte): a completar', { gap: 26 });
    }
  } else {
    draw('Entregar en: ' + (obraSocial || 'su obra social') + ' y/o servicio de transporte', { gap: 26, bold:true });
  }

  // Tabla de horarios
  draw('Días y horarios por prestación:', { bold:true, gap: 20 });
  const prestaciones = Object.keys(horarios);
  if (prestaciones.length === 0){
    draw('(a completar por la coordinadora)', { size:10 });
  } else {
    const colX = [50, 230, 290, 350, 410, 470];
    draw('Prestación', { x: colX[0], bold:true, size:10, gap:0 });
    ['LUN','MAR','MIÉ','JUE','VIE'].forEach((d,i) => {
      page.drawText(d, { x: colX[i+1], y, size:10, font: fontBold });
    });
    y -= 16;
    prestaciones.forEach(pres => {
      page.drawText(pres, { x: colX[0], y, size:10, font });
      DIAS.forEach((dia, i) => {
        const hora = (horarios[pres][dia] || '-');
        page.drawText(hora, { x: colX[i+1], y, size:10, font });
      });
      y -= 16;
    });
  }

  const bytes = await pdfDoc.save();

  const turno = document.getElementById('turnoSelect').value; // MAÑANA o TARDE
  const tipoLabel = tipo === 'familia' ? 'PARA LA FAMILIA' : (obraSocial || 'PARA LA OBRA SOCIAL');
  const nombrePaciente = (pacienteActual.nombre || 'PACIENTE').toUpperCase();
  let nombreArchivo = `${turno}-${tipoLabel}-${nombrePaciente}.pdf`;
  nombreArchivo = nombreArchivo.replace(/[\\/:*?"<>|]/g, '');

  // Si el navegador soporta elegir carpeta de guardado (Chrome/Edge), se usa esa ventana nativa.
  if (window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: nombreArchivo,
        types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(bytes);
      await writable.close();
      return;
    } catch(err){
      if (err && err.name === 'AbortError') return; // la coordinadora canceló el diálogo
      // si falla por otro motivo, sigue con la descarga normal más abajo
    }
  }

  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
